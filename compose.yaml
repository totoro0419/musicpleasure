services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET on the server}
      MUSICPLEASURE_TOKEN: ${MUSICPLEASURE_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_DAILY_BUDGET: ${YOUTUBE_DAILY_BUDGET:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-5368709120}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - music-data:/data
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  music-data:
  # Use a real DNS name pointing to the host. Caddy obtains/renews TLS automatically.
