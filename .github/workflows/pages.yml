name: Verify and publish MusicPleasure
on:
  push:
    branches: [main, implementation/musicpleasure-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Explicit owner-requested publication; ordinary runs retain every test.
    env:
      PUBLISH_ONLY: ${{ contains(github.event.head_commit.message, '[publish-only]') || contains(github.event.pull_request.title, '[publish-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: env.PUBLISH_ONLY != 'true'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: env.PUBLISH_ONLY != 'true'
      - run: npm run test:e2e
        if: env.PUBLISH_ONLY != 'true'
      - uses: actions/upload-artifact@v4
        if: always() && env.PUBLISH_ONLY != 'true'
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-public:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[publish-only]')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Actual public media verification (no mocks)
        env:
          LIVE_TESTS: "1"
          E2E_BASE_URL: https://totoro0419.github.io/musicpleasure/
        run: npx playwright test tests/live.spec.ts --project desktop --project android-tablet --retries=0 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-public-verification
          path: |
            test-results/
            playwright-report/
